<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Nearby Hospitals</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    <style>
        #map { height: 100vh; width: 100%; }
        #backToHome {
            margin-top: 20px;
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }
        #backToHome:hover { background-color: #0056b3; }

        h2 {
            font-size: larger; 
            margin-top: 90px;
            text-align: left;
        }

        .findHospitals {
            display: block;
            color: white;
            background-color: green;
            border-radius: 4px;
            padding: 10px;
            margin: 10px auto;
            cursor: pointer;
            text-align: center;
            width: fit-content;
        }
    </style>
</head>
<body>

    <!-- Back Button -->
    <button id="backToHome">Back to Home</button>
    
    <h2>Nearby Hospitals Locator</h2>
    <button class="findHospitals" id="findHospitals">Find Hospitals</button>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <script>
        document.getElementById("backToHome").addEventListener("click", function() {
            window.location.href = "index.html"; // Replace with your actual home page URL
        });

        // Initialize the map
        let map = L.map('map').setView([20.5937, 78.9629], 5); // Default center: India
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Function to create a map marker with popup
        const createMarker = (lat, lon, name) => {
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(`<b>${name || "Unnamed Hospital"}</b>`);
        };

        const fetchHospitals = (lat, lon) => {
        const API_URL = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:5000,${lat},${lon})[amenity=hospital];out;`;

        fetch(API_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.elements && data.elements.length > 0) {
                    data.elements.forEach(place => {
                        createMarker(place.lat, place.lon, place.tags.name || "Unnamed Hospital");
                    });
                } else {
                    alert("No hospitals found nearby.");
                }
            })
            .catch(error => {
                console.error("Error fetching hospitals:", error);
                alert("Failed to load hospitals. The API might be down or overloaded.");
            });
    };


        // Function to find user's location and search for hospitals
        const findHospitals = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    map.setView([lat, lon], 14);

                    // Mark user's location
                    createMarker(lat, lon, "You are here");

                    // Fetch nearby hospitals
                    fetchHospitals(lat, lon);
                }, () => {
                    alert("Geolocation permission denied. Please allow access to your location.");
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        };

        // Event listener for the "Find Hospitals" button
        document.getElementById("findHospitals").addEventListener("click", findHospitals);
    </script>

</body>
</html>
